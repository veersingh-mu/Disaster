version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: floodpath-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: floodpath
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d floodpath"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: floodpath-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/floodpath
      DATABASE_URL_SYNC: postgresql://postgres:postgrespassword@db:5432/floodpath
      JWT_SECRET: dev_jwt_secret_key_floodpath_sih_26161
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: floodpath-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/floodpath
      DATABASE_URL_SYNC: postgresql://postgres:postgrespassword@db:5432/floodpath
      ENVIRONMENT: development
    volumes:
      - ./worker:/app/worker
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: floodpath-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
